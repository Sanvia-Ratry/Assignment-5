<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="./style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <script src="https://kit.fontawesome.com/2546e45b45.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <header class="px-5 md:px-10 lg:px-20 py-4">
      <div class="flex flex-col gap-4 md:flex-row justify-between items-center">
        <div class="flex gap-1 items-center">
          <img class="w-[36px] h-[37px]" src="./assets/github-logo.png" />
          <h1 class="text-lg md:text-xl lg:text-2xl font-semibold">GitHub Issues Tracker</h1>
        </div>
        <div class="flex gap-1 lg:gap-4">
          <div
            class="flex items-center gap-1 border border-blue-200 rounded px-1 py-1 lg:px-2 lg:py-1.5 bg-white focus-within:border-gray-400"
          >
            <i class="fa-solid fa-magnifying-glass text-slate-400"></i>

            <input
              type="text"
              id="search-input"
              placeholder=" Search Issues..."
              class="outline-none border-none w-full sm:w-[120px] md:w-[200px]"
            />
          </div>
          <button
            id="search-btn"
            class="text-white bg-[#4a00ff] text-center rounded px-1 py-1 lg:px-3 lg:py-2 whitespace-nowrap"
          >
            <i class="fa-solid fa-plus"></i> New Issue
          </button>
        </div>
      </div>
    </header>
    <main class="max-w-[85%] sm:max-w-[80%] md:max-w-[80%] lg:max-w-[70%] mx-auto py-14">
      <section
        id="btn-container"
        class="flex justify-baseline gap-x-4 p-6 bg-white mb-4 rounded-lg"
      ></section>
      <section id="card-section" class="border-transparent shadow-sm rounded-lg">
        <div
          id="card-container"
          class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 p-6 border-t border-t-slate-300"
        ></div>
      </section>
    </main>
    <div id="detail-modal" class="fixed inset-0 z-50 items-center justify-center p-4 hidden">
      <div class="absolute inset-0 bg-black/60 backdrop-blur-[1px]"></div>
      <div
        id="card-modal"
        class="relative z-10 flex flex-col gap-3 border border-transparent w-fit min-w-[300px] max-w-[350px] min-h-[300px] rounded-lg shadow-md p-4 bg-white"
      >
        <div id="card-title" class="font-bold text-lg">Fix navigation menu on mobile devices</div>

        <div class="flex flex-row gap-2 text-sm">
          <button
            id="status"
            class="border border-transparent p-1 bg-green-200 rounded-full text-green-500"
          ></button>
          <h1 class="light-color flex items-center gap-1 text-xs">
            <span class="inline-block h-2 w-2 bg-gray-400 border border-none rounded-full"></span
            >Opened by <span id="author" class="text-gray-700">name</span>
          </h1>
          <p class="light-color flex items-center gap-1">
            <span class="inline-block h-2 w-2 bg-gray-400 border border-none rounded-full"></span
            ><span id="date"></span>
          </p>
        </div>
        <div>
          <button
            id="badge-1"
            class="border border-transparent px-1 bg-yellow-400 rounded-full text-black"
          ></button>
          <button
            id="badge-2"
            class="border border-transparent px-1 bg-yellow-400 rounded-full text-black"
          ></button>
        </div>
        <div>
          <p id="card-des" class="text-gray-600"></p>
        </div>
        <div class="p-2 flex justify-between border border-transparent rounded-lg bg-[#f8fafc]">
          <div>
            <h1 class="light-color">Assignee:</h1>
            <p id="assign-name">Name..</p>
          </div>
          <div class="flex flex-col items-start">
            <h4 class="light-color">Priority:</h4>
            <button id="priority" class="px-2 border border-transparent rounded-full">High</button>
          </div>
        </div>
        <div class="flex justify-end">
          <button onclick="closeModal()" class="activeBtn !w-15">Close</button>
        </div>
      </div>
    </div>
  </body>
  <script src="./functionalities.js"></script>
</html>

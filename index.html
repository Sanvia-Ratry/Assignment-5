<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="./style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <script src="https://kit.fontawesome.com/2546e45b45.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <header class="px-20 py-4">
      <div class="flex justify-between items-center">
        <div class="flex gap-1">
          <img class="w-[36px] h-[37px]" src="./assets/github-logo.png" />
          <h1 class="text-2xl font-semibold">GitHub Issues Tracker</h1>
        </div>
        <div class="flex gap-4">
          <input
            type="text"
            id="search-input"
            placeholder="        Search Issues..."
            class="border border-blue-100 rounded relative"
          /><i class="fa-solid fa-magnifying-glass absolute mt-3 ml-2"></i>
          <button class="text-white bg-[#4a00ff] text-center rounded px-3 py-2">
            <i class="fa-solid fa-plus"></i> New Issue
          </button>
        </div>
      </div>
    </header>
    <main class="max-w-[70%] mx-auto py-14">
      <section
        id="btn-container"
        class="flex justify-baseline gap-x-4 p-6 bg-white mb-4 rounded-lg"
      ></section>
      <section id="card-section" class="border-transparent shadow-sm rounded-lg">
        <div
          id="card-container"
          class="grid grid-cols-4 gap-4 p-6 border-t border-t-slate-300"
        ></div>
      </section>
    </main>
  </body>
  <script src="./functionalities.js"></script>
</html>
